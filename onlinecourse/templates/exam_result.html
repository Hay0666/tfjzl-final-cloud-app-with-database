{% extends "base.html" %}
{% block content %}
<div class="container mt-5 text-center">
    <div class="alert alert-success shadow">
        <h1 class="display-4">Congratulations!</h1>
        <p class="lead">You have successfully completed the exam for <strong>{{ course.name }}</strong>.</p>
    </div>
    
    <div class="card mt-4 shadow-sm">
        <div class="card-body">
            <h3 class="card-title">Exam Submission Success</h3>
            <hr>
            <p class="card-text">Your answers have been recorded. Well done!</p>
        </div>
    </div>

    <a href="{% url 'onlinecourse:course_details' course.id %}" class="btn btn-outline-primary mt-4">
        Back to Course Details
    </a>
</div>
{% endblock %}
